packages:
  - apps/*

# pnpm >= 11 ignores package.json's onlyBuiltDependencies and asks here
# instead (@nexis/design docs/PITFALLS.md §6); without it esbuild never installs.
allowBuilds:
  esbuild: true

# dockview-react pins its own version but depends on dockview/dockview-core by
# caret; hold all three to the vetted release.
overrides:
  dockview: 8.3.1
  dockview-core: 8.3.1
