[package]
name = "tauri-plugin-epoch"
description = "Nexis Epoch's command surface as a Tauri plugin: the standalone Epoch app and Nexis's Epoch window both register it, so they expose the same backend."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
repository.workspace = true
license.workspace = true
# Tauri plugins pass their permission manifests to the app's build script
# through this key; the value must be `tauri-plugin-<name>`.
links = "tauri-plugin-epoch"

[features]
# Compile DuckDB from source (CI / release). Without it, set
# DUCKDB_DOWNLOAD_LIB=1 (see crates/epoch-data/Cargo.toml).
bundled-duckdb = ["epoch-data/bundled"]

[build-dependencies]
tauri-plugin = { version = "2.6.0", features = ["build"] }

[dependencies]
epoch-core.workspace = true
epoch-config.workspace = true
epoch-store.workspace = true
epoch-data.workspace = true
epoch-runtime.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tauri = { version = "2.12.0", features = [] }
sysinfo = { version = "0.39.6", default-features = false, features = ["system"] }

[lints]
workspace = true
