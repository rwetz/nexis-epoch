name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  rust:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      # epoch-data links DuckDB's official prebuilt library in CI tests.
      DUCKDB_DOWNLOAD_LIB: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          # libduckdb-sys downloads the prebuilt library here; if the build
          # cache is restored without it, its build script doesn't rerun and
          # linking fails with "unable to find library -lduckdb".
          cache-directories: target/duckdb-download
      - run: cargo fmt --all --check
      - run: cargo clippy -p epoch-core -p epoch-config -p epoch-store -p epoch-runtime -p epoch-data --all-targets -- -D warnings
      - run: cargo test -p epoch-core -p epoch-config -p epoch-store -p epoch-runtime -p epoch-data

  desktop-check:
    # The Tauri crate with prebuilt DuckDB: catches compile and lint errors in
    # the command layer in minutes, before the slow release builds.
    runs-on: ubuntu-22.04
    env:
      DUCKDB_DOWNLOAD_LIB: "1"
    steps:
      - uses: actions/checkout@v4
      - run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          key: desktop-check
          cache-directories: target/duckdb-download
      - run: pnpm install --frozen-lockfile
      # generate_context! needs the built frontend.
      - run: pnpm build
      - run: cargo clippy -p epoch-desktop --all-targets -- -D warnings

  desktop:
    # The full app: Tauri plus DuckDB compiled in. Slow, so only on main,
    # tags and by hand.
    if: github.event_name != 'pull_request'
    needs: [frontend, rust, desktop-check]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
          - os: ubuntu-22.04
          - os: macos-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - if: startsWith(matrix.os, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: desktop
      - run: pnpm install --frozen-lockfile
      - run: pnpm --dir apps/desktop tauri build --features bundled-duckdb
      - uses: actions/upload-artifact@v4
        with:
          name: nexis-epoch-${{ matrix.os }}
          path: |
            target/release/bundle/**/*.msi
            target/release/bundle/**/*.exe
            target/release/bundle/**/*.deb
            target/release/bundle/**/*.AppImage
            target/release/bundle/**/*.dmg
          if-no-files-found: warn
